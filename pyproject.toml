[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vocab-video-generator"
version = "0.1.0"
description = "A small vocabulary-to-video workflow with pluggable model providers"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vocab-video = "vocab_video_generator.__main__:main"

[tool.setuptools.packages.find]
include = ["vocab_video_generator*"]
