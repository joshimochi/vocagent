[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "vocagent"
version = "0.1.0"
description = "A small vocabulary-to-video workflow with pluggable model providers"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
vocagent = "vocagent.__main__:main"

[tool.setuptools.packages.find]
include = ["vocagent*"]

[tool.setuptools.package-data]
"vocagent.prompts" = ["h3_prompt_guide.md"]
